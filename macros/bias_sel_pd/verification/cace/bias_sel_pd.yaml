    typical: 1
  step:
    description: Transient scenario (see the template)
    display: Step
    typical: 0
  iref:
    description: Harness ibias current
    display: ibias
    unit: uA
    typical: 5
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  corner_pnp:
    description: Process corner pnpMPA
    display: Corner PNP
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

