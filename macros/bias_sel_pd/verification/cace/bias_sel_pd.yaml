    description: 3.3 V supply of bias and front end (iovdd in the pad)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Ground of bias and front end
    type: ground
    direction: inout
  ibias:
    description: Harness reference current input (sourced into this pin), used with sel = 0
    type: signal
    direction: input
  vbp:
    description: Bias line, PMOS unit tails
    type: signal
    direction: output
  vbn:
    description: Bias line, NMOS fold sinks
    type: signal
    direction: output
  vbpc:
    description: Bias line, PMOS mirror cascodes
    type: signal
    direction: output
  vbnc:
    description: Bias line, NMOS fold cascodes
    type: signal
    direction: output
  vabp:
    description: Bias line, class-AB P side
    type: signal
    direction: output
  vabn:
    description: Bias line, class-AB N side
    type: signal
    direction: output
  en_3v3:
    description: Enable, 0 .. vdd, active high
    type: digital
    direction: input
  sel0_3v3:
    description: Select bit 0, 0 .. vdd
    type: digital
    direction: input
  sel1_3v3:
    description: Select bit 1, 0 .. vdd
    type: digital
    direction: input
  en_3v3_b:
    description: NOT en_3v3 (from en_ctrl_3v3), 0 .. vdd
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Supply voltage (vdd = vddo)
    display: VDD
    unit: V
    typical: 3.3
  sel:
    description: Select code (sel1 sel0)
    display: sel
    typical: 0
  en:
    description: Enable (1 = en_3v3 at vdd)
