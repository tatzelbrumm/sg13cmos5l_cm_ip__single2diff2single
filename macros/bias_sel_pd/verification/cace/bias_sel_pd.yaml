#--------------------------------------------------------------
# CACE circuit characterization file: bias_sel_pd
#
# Bias of the class-AB pad driver d2s_mpdda_pd: one mirror tree (bias_tree_pd + four bias diodes; the class-AB stacks
# RP1 + RP2 / RN1 + RN2 are test fixtures in the templates since 2026-10-27, as they are in d2s_mpdda_pd)
# fed by a selectable reference current: sel = 0 harness ibias (sourced), 1 Oguey-Aebischer core,
# 2 bandgap core, 3 both cores.  en_3v3 = 0 switches everything off.
# Source netlist: netlist/source/bias_sel_pd.spice (+ bias_ref_pd.spice, hv_logic.spice).
# The six bias currents are measured as the drain currents of replica loads: one copy of each bias diode,
# gate on its bias line, drain forced to the gate voltage by an ideal buffer, so it carries the diode current.
# The harness iDAC is modelled as a PMOS mirror on its own 3.3 V supply (sourcing, 250 nA per code step).
# The LIMITS are PROPOSALS: worst case of the pre-layout runs (schematic netlist, no parasitics) with
# ~30 % margin. Replace them by requirements when there are any.  "any" = characterized, not specified.
# Sign convention: supply currents positive when delivered by the source.  Testbenches echo SI values.
#--------------------------------------------------------------

name:           bias_sel_pd
description:    Pad-driver bias with selectable reference (harness ibias, Oguey-Aebischer, bandgap) and power-down
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 20, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
