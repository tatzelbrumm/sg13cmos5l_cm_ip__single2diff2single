        typical: typ
      corner_pnp:
        typical: typ
      temp:
        enumerate: [27, 125]

  # Settling: steps 0-2 enable with sel 0 / 1 / 2, steps 3-5 sel 0->1 / 1->2 / 2->0, at ss / tt / ff, 27 C = 18 runs
  tran_params:
