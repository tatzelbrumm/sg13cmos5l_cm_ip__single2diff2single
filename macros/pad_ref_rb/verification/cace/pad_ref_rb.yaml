#--------------------------------------------------------------
# CACE circuit characterization file: pad_ref_rb (generated by ../gen_cace.py)
#--------------------------------------------------------------
# Replica bias of the custom pads: shared tree bias_tree_rb, vcm_rb (S2D vcm = D2S vref, centre of the linear band) and vref_s2d_rb (S2D vref, about 0.5 V), one enable
# The DUT sits next to en_ctrl_3v3 and bias_gen_pd (as in the pads' templates); its supply vddb is a separate source at
# iovdd so its current is measured (tree + vcm_rb + vref_s2d_rb, without the 5 uA reference it takes from bias_gen_pd).
# Limits: the bands measured in the gap runs of docs/replica_bias/ (macros/vcm_rb/testbenches/pad_char/results).
# Run on the schematic only (-s schematic); mismatch is vacuous on extracted netlists.

name:           pad_ref_rb
description:    "Replica bias of the custom pads: shared tree bias_tree_rb, vcm_rb (S2D vcm = D2S vref, centre of the linear band) and vref_s2d_rb (S2D vref, about 0.5 V), one enable"
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    November 6, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vddh:
    description: Supply of the block (the pads' iovdd or the slot's vdd_3v3)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vssh:
    description: Ground of the block (the pads' iovss or the slot's vss_3v3)
    type: ground
    direction: inout
  iref:
    description: 5 uA reference current, sourced into the block (bias_tree_rb's NMOS diode)
    type: signal
    direction: input
  vcm:
    description: Internal common mode of the pads, S2D vcm = D2S vref (gates of the pads only)
    type: signal
    direction: output
  vref:
    description: S2D pad reference, about 0.5 V (gates of the pads only)
    type: signal
    direction: output
  en_3v3:
    description: Enable, 3.3 V logic, active high
    type: digital
    direction: input
  en_3v3_b:
    description: Complement of en_3v3
    type: digital
    direction: input

default_conditions:
  vdd:
    description: IO ring supply voltage
    display: IOVDD
    unit: V
    typical: 3.3
  vddl:
    description: Core ring supply voltage
    display: VDD core
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor (bias_gen_pd's bandgap core)
    display: Corner R
    typical: typ
  corner_pnp:
    description: Process corner PNP (bandgap core)
    display: Corner PNP
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  sel:
    description: Reference selection of bias_gen_pd (0 harness, 1 OA core, 2 bandgap)
    display: Bias select
    typical: 0
  ibias:
    description: Harness bias current
    display: Ibias
    unit: A
    typical: 5e-06
  en:
    description: en_1v2 (1.2 V enabled, 0 disabled)
    display: Enable
    unit: V
    typical: 1.2

