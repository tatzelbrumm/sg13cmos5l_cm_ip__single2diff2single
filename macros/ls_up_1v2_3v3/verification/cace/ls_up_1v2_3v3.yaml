# CACE circuit characterization file: ls_up_1v2_3v3
#
# Scaffolded by scripts/gen_cace.py, then meant to be edited by hand.
# The LIMITS below are PROPOSALS, set with margin above the worst case of the pre-layout PVT
# results in simulation/iq_summary.txt (schematic netlist, no parasitics).  Tighten or relax them as the design
# requirements become known; "any" means characterized but not specified.
# Sign convention of all currents and charges: positive = delivered by the source.
#--------------------------------------------------------------

name:           ls_up_1v2_3v3
description:    Level shifter up, 1.2 V -> 3.3 V (SAR ADC cross-coupled shifter, non-inverting)
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 4, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDDL:
    description: Low-voltage supply (1.2 V domain)
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.32
  VDDH:
    description: High-voltage supply (3.3 V domain)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  VSS:
    description: Ground
    type: ground
    direction: inout
  in:
    description: Logic input, swing 0 .. VDDL
    type: signal
    direction: input
  out:
    description: Logic output, swing 0 .. VDDH
    type: signal
    direction: output

default_conditions:
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  vddl:
    description: Low-voltage supply
    display: VDDL
    unit: V
    typical: 1.2
  vddh:
    description: High-voltage supply
    display: VDDH
    unit: V
    typical: 3.3
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  tr:
    description: Input transition time (rise = fall), 0 to full swing
    display: Input transition time
    unit: ps
    typical: 100
  cload:
    description: Load capacitance at out
    display: Cload
    unit: fF
    typical: 20

parameters:
  # PVT: 5 MOS corners x 3 temperatures x 3 VDDL x 3 VDDH = 135 runs, tr 100 ps, cload 20 fF
  pvt_params:
    spec:
      td_r:
        display: Delay, input rising
        description: 50 % input to 50 % output, input rising edge
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 10
      td_f:
        display: Delay, input falling
        description: 50 % input to 50 % output, input falling edge
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 14
      Voh:
        display: Output high level
        description: Settled output voltage, high state
        unit: V
        minimum:
          value: 2.85
        typical:
          value: any
        maximum:
          value: any
      Vol:
        display: Output low level
        description: Settled output voltage, low state
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.05
      Iq_vddl_inlo:
        display: Iq VDDL, input low
        description: Quiescent current delivered by VDDL, input low
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.5e+04
      Iq_vddl_inhi:
        display: Iq VDDL, input high
        description: Quiescent current delivered by VDDL, input high
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.5e+04
      Iq_vddh_inlo:
        display: Iq VDDH, input low
        description: Quiescent current delivered by VDDH, input low
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 4000
      Iq_vddh_inhi:
        display: Iq VDDH, input high
        description: Quiescent current delivered by VDDH, input high
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 4000
      Iq_in_inlo:
        display: Iq input, input low
        description: Magnitude of the quiescent input current, input low
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 300
      Iq_in_inhi:
        display: Iq input, input high
        description: Magnitude of the quiescent input current, input high
        unit: pA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 300
      Q_vddl_r:
        display: Q VDDL, input rising
