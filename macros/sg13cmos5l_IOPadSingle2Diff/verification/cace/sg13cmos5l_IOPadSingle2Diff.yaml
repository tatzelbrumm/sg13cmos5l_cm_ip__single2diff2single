        description: Power-down state (0 en low, 1 slot vdd_1v2 off, 2 slot vdd_3v3 off, 3 chip core 1.2 V off)
        display: PD state
        enumerate: [0, 1, 2, 3]
      vpad:
        description: Pad voltage held by an external source
        display: Vpad
        unit: V
        enumerate: [0, 1.65, 3.3]
      temp:
        enumerate: [27, 125]
  #------------------------------------------------------------ enable transient (en_1v2 0 -> 1.2 V at 1 us, u = +0.25 V)
  enable_params:
    spec:
      t_on:
        display: Enable time
        description: en_1v2 edge to vd within 1 mV of its end value
        unit: us
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 3
      Vc_max:
        display: Output CM glitch, high
        description: max (outp + outn)/2 - vcm after the edge
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vc_min:
        display: Output CM glitch, low
        description: min (outp + outn)/2 - vcm after the edge
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vd_end:
        display: Differential output at the end
        description: ideal 0.5 V
        unit: V
        minimum:
          value: any
        typical:
          value: 0.5
        maximum:
          value: any
      Iio_on:
        display: IO ring current, enabled
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: sg13cmos5l_IOPadSingle2Diff_tb_enable.sch
        format: ascii
        suffix: .data
        variables: [t_on, Vc_max, Vc_min, Vd_end, Iio_on]
    plot:
      t_on_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: t_on
        limits: auto
    conditions:
      corner_mos:
        enumerate: [ss, tt, ff]
      temp:
        enumerate: [-40, 27, 125]
  #------------------------------------------------------------ mismatch Monte Carlo
  mm_params:
    spec:
      Vos_in:
        display: Input offset - Mismatch
        unit: mV
        minimum:
          value: -20
        typical:
          value: any
        maximum:
          value: 20
      Gain:
        display: Gain - Mismatch
        minimum:
          value: 1.93
        typical:
          value: any
        maximum:
          value: 2.07
      Vcm_err:
        display: Output common-mode error - Mismatch
        unit: mV
        minimum:
          value: -60
        typical:
          value: any
        maximum:
          value: 60
    tool:
      ngspice:
        template: sg13cmos5l_IOPadSingle2Diff_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_in, INL, Vcm_err, Iio]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        typical: 27
  #------------------------------------------------------------ process Monte Carlo
  mc_params:
    spec:
      Vos_in:
        display: Input offset - Process MC
        unit: mV
        minimum:
          value: -5
        typical:
          value: any
        maximum:
          value: 5
      Gain:
        display: Gain - Process MC
        minimum:
          value: 1.99
        typical:
          value: any
        maximum:
          value: 2.01
      Vcm_err:
        display: Output common-mode error - Process MC
        unit: mV
        minimum:
          value: -30
        typical:
          value: any
        maximum:
          value: 30
    tool:
      ngspice:
        template: sg13cmos5l_IOPadSingle2Diff_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_in, INL, Vcm_err, Iio]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 30
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_stat
      # rhigh stays at typ: the PDK's res_stat draws its "global" sheet-resistance deviation in a .model
      # inside the rhigh subcircuit, so every instance draws its own (acts as 5 % unit mismatch; see the
      # design's verification/cace/README.md).
      corner_r:
        typical: typ
      temp:
        typical: 27
