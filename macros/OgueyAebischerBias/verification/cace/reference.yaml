#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------
#
# Characterizes the combined macro schematic/xschem/reference.sch (xbias =
# OgueyAebischerBias.sch, the resistor-free core + cascode fan-out; xstart =
# ToBiasStartup.sch, the start-up kick + disable), following the same
# grouping used in the precedent this circuit was ported from:
# TinyTapeout/designs/tt10-analog-tatzelreference (sky130).
#
# dc_params and tran_startup_params below are wired to real testbench
# templates (reference_tb_dc.sch / reference_tb_tran.sch) and should run
# as-is, but neither has been opened in Xschem or simulated yet -- check
# them before trusting results. ac_psrr_params, noise_params,
# disable_params and mm_params are fully specified (targets adapted from
# ../../../../../sky130_cm_ip__biasgen/README.md's spec table for the same
# core circuit) but their `tool:` templates do not exist yet -- see the
# TODO on each.

name:           reference
description:    Oguey-Aebischer resistor-free bias reference + start-up kick, for the ihp-sg13cmos5l chip template
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    September 4, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vbp:
    description: PMOS current-mirror bias voltage (to downstream PMOS legs)
    type: signal
    direction: output
  vbn:
    description: NMOS current-mirror bias voltage (to downstream NMOS legs)
    type: signal
    direction: output
  vbr:
    description: Resistor-free reference node (Oguey-Aebischer core)
    type: signal
    direction: output
  disable:
    description: Active-high shutdown of the core and start-up kick
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 3.3
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  dc_params:
    spec:
      Vbp_val:
        display: PMOS mirror bias voltage
        description: DC operating-point value of vbp, disable held low
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vbn_val:
        display: NMOS mirror bias voltage
        description: DC operating-point value of vbn, disable held low
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vbr_val:
        display: Resistor-free reference voltage
        description: DC operating-point value of vbr, disable held low
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Ibias_val:
        display: Core reference current
        description: Core branch current, read from the schematic's own Vi1 ammeter (x1.xbias.vi1)
        unit: A
        minimum:
          value: 2e-7
        typical:
          value: any
        maximum:
          value: 1e-6
    tool:
      ngspice:
        template: reference_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vbp_val, Vbn_val, Vbr_val, Ibias_val]
    plot:
      Vbp_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Vbp_val
        limits: auto
      Vbn_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Vbn_val
        limits: auto
      Vbr_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Vbr_val
        limits: auto
      Ibias_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Ibias_val
        limits: auto
      Ibias_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Ibias_val
        limits: auto
      Ibias_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Ibias_val
        limits: auto
    conditions:
      vdd:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 85

  tran_startup_params:
    spec:
      t_startup:
        display: Start-up time
        description: Time from VDD ramp start until vbr first crosses 100mV, no .nodeset assist
        unit: s
        minimum:
          value: any
        typical:
          value: 2e-5
        maximum:
          value: 4e-5
      Vbp_final:
        display: Settled vbp
        description: vbp at the end of the start-up transient (sanity read-back)
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vbn_final:
        display: Settled vbn
        description: vbn at the end of the start-up transient (sanity read-back)
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vbr_final:
        display: Settled vbr
        description: vbr at the end of the start-up transient (sanity read-back)
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: reference_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [t_startup, Vbp_final, Vbn_final, Vbr_final]
    plot:
      t_startup_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: t_startup
        limits: auto
      t_startup_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: t_startup
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 85
      tstep:
        description: Transient time step
        display: tstep
        unit: s
        typical: 1u
      tstop:
        description: Transient stop time
        display: tstop
        unit: s
        typical: 200u

  # TODO: no testbench template exists yet for the four groups below.
  # Targets are carried over from ../../../../../sky130_cm_ip__biasgen/README.md's
  # spec table (same Oguey-Aebischer core, 2024) as a starting point, not
  # numbers derived from a sg13cmos5l simulation.

  ac_psrr_params:
    spec:
      PSRR_vbr:
        display: PSRR of vbr at 1kHz
        description: 'TODO: needs reference_tb_ac_psrr.sch (AC source on vdd, vbr as output)'
        unit: dB
        minimum:
          value: 50
        typical:
          value: 60
        maximum:
          value: any
    tool:
      ngspice:
        template: reference_tb_ac_psrr.sch   # TODO: does not exist yet
        format: ascii
        suffix: .data
        variables: [PSRR_vbr]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        typical: 27

  noise_params:
    spec:
      Ibias_noise:
        display: Output current noise density
        description: 'TODO: needs reference_tb_noise.sch (.noise analysis on the mirrored output current), 0.1-10Hz band per sky130_cm_ip__biasgen precedent'
        unit: nA/rtHz
        minimum:
          value: any
        typical:
          value: 0.5
        maximum:
          value: 1
    tool:
      ngspice:
        template: reference_tb_noise.sch   # TODO: does not exist yet
        format: ascii
        suffix: .data
        variables: [Ibias_noise]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        typical: 27

  disable_params:
    spec:
      t_disable:
        display: Turn-off time
        description: 'TODO: needs reference_tb_tran_disable.sch (disable asserted mid-transient, measure vbr collapse time)'
        unit: s
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Iq_enabled:
        display: Quiescent supply current, enabled
        description: 'TODO: same testbench, measure i(VDD) with disable low'
        unit: A
        minimum:
          value: any
        typical:
          value: 1e-5
        maximum:
          value: 2e-5
      Iq_disabled:
        display: Quiescent supply current, disabled
        description: 'TODO: same testbench, measure i(VDD) with disable high'
        unit: A
        minimum:
          value: any
        typical:
          value: 1e-8
        maximum:
          value: 2e-8
    tool:
      ngspice:
        template: reference_tb_tran_disable.sch   # TODO: does not exist yet
        format: ascii
        suffix: .data
        variables: [t_disable, Iq_enabled, Iq_disabled]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        typical: 27

  mm_params:
    spec:
      Ibias_accuracy:
        display: Core current accuracy - Mismatch
        description: 'TODO: needs a Monte Carlo mismatch collation script, see macros/inverter''s ac_mm_params for the pattern (script + collate: iterations)'
        unit: '%'
        minimum:
          value: -2
        typical:
          value: 0
        maximum:
          value: 2
      Leg_matching:
        display: Leg-to-leg current matching - Mismatch
        description: 'TODO: reference_tb_dc.sch already has two more usable probes (x1.xbias.vi4, x1.xbias.viaux) besides vi1 -- extend that template rather than starting from scratch'
        unit: '%'
        minimum:
          value: -1
        typical:
          value: 0
        maximum:
          value: 1
    tool:
      ngspice:
        template: reference_tb_dc_mm.sch   # TODO: does not exist yet
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Ibias_accuracy, Leg_matching]
    conditions:
      vdd:
        typical: 3.3
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        typical: 27
