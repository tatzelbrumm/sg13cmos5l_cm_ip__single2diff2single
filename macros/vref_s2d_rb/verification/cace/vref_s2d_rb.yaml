#--------------------------------------------------------------
# CACE circuit characterization file: vref_s2d_rb (generated by ../gen_cace.py)
#--------------------------------------------------------------
# Replica bias for the s2d pad reference: about 0.5 V at 27 C, above the input window's edge when hot
# The DUT sits next to en_ctrl_3v3 and bias_gen_pd (as in the pads' templates); its supply vddb is a separate source at
# iovdd so its current is measured (without the 5 uA reference it takes from bias_gen_pd's iref).
# Limits: the bands measured in the gap runs of docs/replica_bias/ (macros/vcm_rb/testbenches/pad_char/results).
# Run on the schematic only (-s schematic); mismatch is vacuous on extracted netlists.

name:           vref_s2d_rb
description:    "Replica bias for the s2d pad reference: about 0.5 V at 27 C, above the input window's edge when hot"
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    November 6, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: IO ring supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: IO ring ground
    type: ground
    direction: inout
  iref:
    description: 5 uA reference current, sourced into the block
    type: signal
    direction: input
  vref:
    description: Output (gates of the pads only)
    type: signal
    direction: output
  en_3v3:
    description: Enable, 3.3 V logic, active high
    type: digital
    direction: input
  en_3v3_b:
    description: Complement of en_3v3
    type: digital
    direction: input

default_conditions:
  vdd:
    description: IO ring supply voltage
    display: IOVDD
    unit: V
    typical: 3.3
  vddl:
    description: Core ring supply voltage
    display: VDD core
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor (bias_gen_pd's bandgap core)
    display: Corner R
    typical: typ
  corner_pnp:
    description: Process corner PNP (bandgap core)
    display: Corner PNP
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  sel:
    description: Reference selection of bias_gen_pd (0 harness, 1 OA core, 2 bandgap)
    display: Bias select
    typical: 0
  ibias:
    description: Harness bias current
    display: Ibias
    unit: A
    typical: 5e-06
  en:
    description: en_1v2 (1.2 V enabled, 0 disabled)
    display: Enable
    unit: V
    typical: 1.2

parameters:

  room_params:
    spec:
      Vref:
        display: "Output at 27 C (pad range from 0 V)"
        unit: V
        minimum:
          value: 0.47
        typical:
          value: any
        maximum:
          value: 0.51
      Ib:
        display: "Block supply current (without the reference)"
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 8
    tool:
      ngspice:
        template: vref_s2d_rb_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vref, Ib]
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        typical: 27
  hot_params:
    spec:
      Vref:
        display: "Output at 125 C (above the S2D input INL edge, <= 0.542 V)"
        unit: V
        minimum:
          value: 0.55
        typical:
          value: any
        maximum:
          value: 0.7
      Ib:
        display: "Block supply current (without the reference)"
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 8
    tool:
      ngspice:
        template: vref_s2d_rb_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vref, Ib]
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        typical: 125
  cold_params:
    spec:
      Vref:
        display: "Output at -40 C (pad range from 0 V)"
        unit: V
        minimum:
          value: 0.35
        typical:
          value: any
        maximum:
          value: 0.5
      Ib:
        display: "Block supply current (without the reference)"
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 8
    tool:
      ngspice:
        template: vref_s2d_rb_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vref, Ib]
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        typical: -40
  pd_params:
    spec:
      Vref:
        display: "Output, disabled"
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.001
      Ib:
        display: "Block supply current, disabled"
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.1
    tool:
      ngspice:
        template: vref_s2d_rb_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vref, Ib]
    conditions:
      en:
        typical: 0
      vdd:
        typical: 3.6
      corner_mos:
        enumerate: [tt, ff]
      temp:
        enumerate: [27, 125]
  mm_params:
    spec:
      Vref:
        display: "Output - Mismatch (tt 27 C 3.3 V)"
        unit: V
        minimum:
          value: 0.47
        typical:
          value: any
        maximum:
          value: 0.52
      Ib:
        display: "Block supply current - Mismatch"
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 8
    tool:
      ngspice:
        template: vref_s2d_rb_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Vref, Ib]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      temp:
        typical: 27
