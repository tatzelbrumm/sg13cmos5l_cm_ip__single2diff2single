      Ibp:
        display: Bias current bp
        description: vbp line (BP diode, unit tails Ta, Tb), nominal 5 uA
        unit: uA
        minimum:
          value: 4.92
        typical:
          value: any
        maximum:
          value: 5.12
      Ibn:
        display: Bias current bn
        description: vbn line (BN diode, fold sinks SX, SY), nominal 5 uA
        unit: uA
        minimum:
          value: 4.93
        typical:
          value: any
        maximum:
          value: 5.14
      Ibnc:
        display: Bias current bnc
        description: vbnc line (BNC diode, fold cascodes CX, CY), nominal 2 uA
        unit: uA
        minimum:
          value: 1.97
        typical:
          value: any
        maximum:
          value: 2.12
      Ibpc:
        display: Bias current bpc
        description: vbpc line (BPC diode, mirror cascodes PCL, PCR), nominal 2 uA
        unit: uA
        minimum:
          value: 1.86
        typical:
          value: any
        maximum:
          value: 2.03
      Iabp:
        display: Bias current abp
        description: vabp line (RP2 on RP1, class-AB ABP / FPL), nominal 5 uA
        unit: uA
        minimum:
          value: 4.87
        typical:
          value: any
        maximum:
          value: 5.1
      Iabn:
        display: Bias current abn
        description: vabn line (RN2 on RN1, class-AB ABN / FNL), nominal 5 uA
        unit: uA
        minimum:
          value: 4.92
        typical:
          value: any
        maximum:
          value: 5.13
      Idd:
        display: Supply current vdd
        description: Current from vdd (the cell, without vddo)
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 39
      Iddo:
        display: Supply current vddo
        description: Current from vddo (= the class-AB stack RP1 + RP2, a test fixture since 2026-10-27)
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 6.7
      Sbp:
        display: Line sensitivity bp
        description: dbp / bp per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.7
      Sbn:
        display: Line sensitivity bn
        description: dbn / bn per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.9
      Sbnc:
        display: Line sensitivity bnc
        description: dbnc / bnc per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.9
      Sbpc:
        display: Line sensitivity bpc
        description: dbpc / bpc per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.8
      Sabp:
        display: Line sensitivity abp
        description: dabp / abp per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 3.4
      Sabn:
        display: Line sensitivity abn
        description: dabn / abn per volt of vdd = vddo, +-0.1 V around the condition
        unit: '%/V'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 3.0
    tool:
      ngspice:
        template: bias_bg_pd_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Ibp, Ibn, Ibnc, Ibpc, Iabp, Iabn, Idd, Iddo, Sbp, Sbn, Sbnc, Sbpc, Sabp, Sabn]
    plot:
      Ibn_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Ibn
      Iabp_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Iabp
      Ibn_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Ibn
      Ibn_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Ibn
    conditions:
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      vdd:
        enumerate: [3.0, 3.3, 3.6]

