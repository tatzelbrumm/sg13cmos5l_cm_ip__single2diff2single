#--------------------------------------------------------------
# CACE circuit characterization file: bias_bg_pd
#
# Bias of the class-AB pad driver d2s_mpdda_pd: self-contained current-mode bandgap (pnpMPA, rhigh) + mirror tree, with the power-down enable en_3v3.
# Source netlist: ../../bias_tree_pd/netlist/source/bias_ref_pd.spice (subckt bias_bg_pd).
# The six bias currents are read as the drain currents of the six diodes inside the cell
# (@n.x1.<diode>[ids]), the quantity run_bias.py reports; the PSRR testbench uses replicas of the
# diodes instead (AC current needs a sense source), which carry the same small-signal current.
# The LIMITS are PROPOSALS: worst case of the pre-layout runs of 2026-10-20 plus about 25 - 40 %
# margin (schematic netlist, no parasitics). Replace them by requirements. "any" = report only.
# Run on the schematic netlist (-s schematic): mismatch is vacuous on an extracted netlist.
# Sign convention: currents positive = delivered by the source.
# 2026-10-27: the class-AB stacks RP1 + RP2 / RN1 + RN2 are test fixtures in the templates (in the pad they are in
# d2s_mpdda_pd), the AB currents read at @n.xrp2 / @n.xrn2; same devices on the same nets as before, so the
# results stand.
#--------------------------------------------------------------

name:           bias_bg_pd
description:    Bias for d2s_mpdda_pd, self-contained current-mode bandgap (pnpMPA, rhigh) + mirror tree, with power-down
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 20, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Analog supply (front end and bias)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vbp:
    description: Bias line vbp (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  vbn:
    description: Bias line vbn (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  vbpc:
    description: Bias line vbpc (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  vbnc:
    description: Bias line vbnc (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  vabp:
    description: Bias line vabp (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  vabn:
    description: Bias line vabn (diode gate line, to d2s_mpdda_pd)
    type: signal
    direction: output
  en_3v3:
    description: Enable, 0 / vdd, active high
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Supply voltage (vdd = vddo)
    display: VDD
    unit: V
    typical: 3.3
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  corner_pnp:
    description: Process corner pnpMPA
    display: Corner PNP
    typical: typ
  tramp:
    description: Supply ramp time from 0 V
    display: Ramp time
    unit: us
    typical: 1
  ten:
    description: Simulated time after the en_3v3 edge
    display: t after enable
    unit: us
    typical: 50

parameters:

