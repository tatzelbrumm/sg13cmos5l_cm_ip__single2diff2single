#--------------------------------------------------------------
# CACE circuit characterization file — top-level skeleton
#
# Written top-down against the boundary in TOP_LEVEL_MODULE.md, not
# against a finished circuit — five of six internal blocks are still
# schematic-less (see that file, §1). Only `dc_connectivity` below is
# meant to produce real numbers today, against whatever DUT is currently
# wired into sg13cmos5l_cm_ip__single2diff2single.sch (still the inherited
# `inverter` placeholder as of this writing). Every other group is
# structural scaffolding: correct pins, correct conditions, `minimum`/
# `maximum: any` until the real block exists to characterize.
#
# Referenced testbench templates under verification/cace/templates/ are
# NOT all authored yet — see the per-group notes below. This file defines
# the shape of the characterization, not a runnable `make sim-cace`.
#--------------------------------------------------------------

name:           sg13cmos5l_cm_ip__single2diff2single
description:    Single-ended <-> differential <-> single-ended analog pin buffer pair, ihp-sg13cmos5l Chipalooza harness slot
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    September 4, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

# Pins as this repo's own floorplan actually exposes them (analog_0-2,
# ui_in/uo_out/uio_*, clk/ena/rst_n, VPWR/VAPWR/VGND) — NOT
# user_project_wrapper_3a.v's ports directly. See TOP_LEVEL_MODULE.md §2
# for why those are two different, deliberately separate boundaries: this
# is the packaging/precheck-stage macro this repo actually builds, the
# harness-facing conversion happens at a later integration layer.
pins:
  VPWR:
    description: Digital/core supply (domain split vs. VAPWR still open, TOP_LEVEL_MODULE.md §4)
    type: power
    direction: inout
    Vmin: 1.4
    Vmax: 1.6
  VAPWR:
    description: Analog supply (domain split vs. VPWR still open, TOP_LEVEL_MODULE.md §4)
    type: power
    direction: inout
    Vmin: 1.4
    Vmax: 1.6
  VGND:
    description: Common ground return
    type: ground
    direction: inout
  analog_0:
    description: vin — single-ended analog input (S2D input buffer)
    type: signal
    direction: input
  analog_1:
    description: vout — single-ended analog output (D2S output buffer)
    type: signal
    direction: output
  analog_2:
    description: vcm — V_CM reference pin, switchable pin/internal/infrastructure (TOP_LEVEL_MODULE.md §3)
    type: signal
    direction: inout
  ena:
    description: Master enable
    type: digital
    direction: input
  rst_n:
    description: Active-low reset (polarity assumed, not confirmed against spec)
    type: digital
    direction: input
  clk:
    description: Clock — candidate role TBD, see TOP_LEVEL_MODULE.md §2.2 (not necessarily continuously available once harness-embedded)
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Digital/core supply voltage (VPWR)
    display: VPWR
    unit: V
    typical: 1.5
  vapwr:
    description: Analog supply voltage (VAPWR)
    display: VAPWR
    unit: V
    typical: 1.5
  vcm:
    description: Common-mode / bias-point voltage
    display: Vcm
    unit: V
    typical: 0.75
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance on vout
    display: Cload
    unit: pF
    typical: 10

parameters:

  # -------------------------------------------------------------
  # The one group meant to be real today. Runs against whatever DUT is
  # currently in sg13cmos5l_cm_ip__single2diff2single.sch, including the
  # inherited inverter placeholder — the point is pin-level sanity, not
  # circuit performance.
  # -------------------------------------------------------------
  dc_connectivity:
    spec:
      Vout_dc:
        display: DC output level at vout
        description: Operating-point voltage at analog_1, sanity check that the pin is driven and not floating
        unit: V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vcm_dc:
        display: DC level at vcm pin
        description: Operating-point voltage at analog_2
        unit: V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_dc.sch  # NOT YET AUTHORED — see note below
        format: ascii
        suffix: .data
        variables: [Vout_dc, Vcm_dc]
    plot:
      Vout_dc_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Vout_dc
        limits: auto
    conditions:
      vdd:
        typical: 1.5
      vapwr:
        typical: 1.5
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        typical: 27

  # -------------------------------------------------------------
  # Placeholder groups below: structurally complete, no testbench
  # template exists yet, `minimum`/`maximum: any` throughout. Fill in
  # once the S2D input buffer / D2S output buffer schematics exist.
  # -------------------------------------------------------------

  gain_bandwidth:
    spec:
      Adm_dB:
        display: Differential gain, vin to vout
        description: Small-signal gain through S2D buffer -> internal differential path -> D2S buffer, gmC stage bypassed
        unit: dB
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      fcu:
        display: Upper -3dB cut-off frequency
        description: Upper -3dB cut-off frequency, vin to vout
        unit: Hz
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_ac.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Adm_dB, fcu]
    plot:
      Adm_dB_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Adm_dB
        limits: auto
      Adm_dB_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Adm_dB
        limits: auto
    conditions:
      vdd:
        typical: 1.5
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        typical: 27
      cload:
        typical: 10

  offset_noise:
    spec:
      Vos:
        display: Input-referred offset
        description: DC offset referred to vin, buffers enabled, filter bypassed
        unit: mV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vn_out:
        display: Output-referred noise
        description: Integrated output-referred noise, vin to vout
        unit: uV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_noise.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Vos, Vn_out]
    plot:
      Vos_mc:
        type: histogram
        xaxis: Vos
    conditions:
      vdd:
        typical: 1.5
      corner_mos:
        typical: tt_stat
      corner_r:
        typical: stat
      iterations:
        description: Monte Carlo iterations
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1

  psrr:
    spec:
      PSRR_dB:
        display: Power-supply rejection ratio
        description: PSRR from VAPWR to vout — directly relevant to TOP_LEVEL_MODULE.md §4's domain-split question
        unit: dB
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_psrr.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [PSRR_dB]
    plot:
      PSRR_dB_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: PSRR_dB
        limits: auto
    conditions:
      vdd:
        typical: 1.5
      temp:
        typical: 27

  vcm_reference:
    spec:
      Vcm_accuracy:
        display: V_CM accuracy vs. VAPWR/2
        description: Deviation of the internal V_CM reference from VAPWR/2, internal mode (vcmsel), TOP_LEVEL_MODULE.md §3
        unit: mV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vcm_line_reg:
        display: V_CM line regulation
        description: dVcm/dVAPWR
        unit: mV/V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_vcm.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Vcm_accuracy, Vcm_line_reg]
    plot:
      Vcm_accuracy_vs_vapwr:
        type: xyplot
        xaxis: vapwr
        yaxis: Vcm_accuracy
        limits: auto
    conditions:
      vapwr:
        minimum: 1.4
        typical: 1.5
        maximum: 1.6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]

  bias_reference:
    spec:
      Ibias_val:
        display: Bias current, internal source
        description: >-
          Placeholder only — OgueyAebischerBias has its own dedicated CACE
          deck at macros/OgueyAebischerBias/verification/cace/, this group
          exists to characterize the bias distribution NET at the top
          level (i.e. does vbp/vbn actually reach every consumer at the
          voltage the reference intended), not to duplicate that macro's
          own device-level characterization.
        unit: nA
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_bias.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Ibias_val]
    plot:
      Ibias_val_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Ibias_val
        limits: auto
    conditions:
      vdd:
        typical: 1.5
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
