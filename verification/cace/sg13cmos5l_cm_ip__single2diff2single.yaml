#
#--------------------------------------------------------------
# CACE circuit characterization file — top-level skeleton
#
# Written top-down against the boundary in TOP_LEVEL_MODULE.md, not
# against a finished circuit — five of six internal blocks are still
# schematic-less (see that file, §1). Only `dc_connectivity` below is
# meant to produce real numbers today, against whatever DUT is currently
# wired into sg13cmos5l_cm_ip__single2diff2single.sch (currently gutted:
# boundary pins only, no internal blocks yet). Every other group is
# structural scaffolding: correct pins, correct conditions, `minimum`/
# `maximum: any` until the real block exists to characterize.
#
# Referenced testbench templates under verification/cace/templates/ are
# NOT all authored yet — see the per-group notes below. This file defines
# the shape of the characterization, not a runnable `make sim-cace`.
#
# 2026-09-04: pins reconciled against sg13cmos5l_ocd_chipalooza's real
# harness RTL (verilog/rtl/user_project_wrapper_3a.v), not this repo's own
# inherited eFPGA-template floorplan. See TOP_LEVEL_MODULE.md §2. No
# rst_n/reset pin: the harness has none per-project (chip-global only, via
# housekeeping SPI). Scan chain reopened, not decided — see §2.3; the
# digital control pins below are the direct-to-dig_in working default.
#--------------------------------------------------------------

name:           sg13cmos5l_cm_ip__single2diff2single
description:    Single-ended <-> differential <-> single-ended analog pin buffer pair, ihp-sg13cmos5l Chipalooza harness slot
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    September 4, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

# Pins as reconciled against user_project_wrapper_3a.v (TOP_LEVEL_MODULE.md
# §2), matching sg13cmos5l_cm_ip__single2diff2single.sym as of 2026-09-04.
pins:
  vdd_3v3:
    description: Gated analog supply (user_project_wrapper_3a.v vdd_3v3)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vdd_1v2:
    description: Gated digital/control supply (also powers the harness's own SPI/sequencer, not isolated — TOP_LEVEL_MODULE.md §4)
    type: power
    direction: inout
    Vmin: 1.1
    Vmax: 1.5
  vss_3v3:
    description: Analog ground return
    type: ground
    direction: inout
  vss_1v2:
    description: Digital ground return
    type: ground
    direction: inout
  vssio:
    description: Global substrate/ESD ground, independent of vss_3v3/vss_1v2
    type: ground
    direction: inout
  vin:
    description: Single-ended analog input (S2D input buffer) — analog_pin[0]
    type: signal
    direction: input
  vout:
    description: Single-ended analog output (D2S output buffer) — analog_pin[1]
    type: signal
    direction: output
  vcm:
    description: V_CM reference pin, switchable pin/internal/infrastructure (TOP_LEVEL_MODULE.md §3) — analog_pin[2]
    type: signal
    direction: inout
  vdiffp:
    description: Unbuffered internal differential node, positive — analog_bus[0] candidate, shared/enable-gated (TOP_LEVEL_MODULE.md §2)
    type: signal
    direction: inout
  vdiffn:
    description: Unbuffered internal differential node, negative — analog_bus[1] candidate, shared/enable-gated
    type: signal
    direction: inout
  ibias:
    description: Infrastructure bias current option, alternative/complement to OgueyAebischerBias (TOP_LEVEL_MODULE.md §3) — ibias[0]
    type: signal
    direction: input
  igmc:
    description: Infrastructure bias current option for the gmC stage — ibias[1]
    type: signal
    direction: input
  vbias:
    description: Infrastructure bias voltage, candidate feed for V_CM reference
    type: signal
    direction: input
  ena:
    description: Master enable (harness's dedicated per-slot enable, not shared)
    type: digital
    direction: input
  clk:
    description: Control-logic clock — gated to proj_clk = select & clk, not continuously available once harness-embedded (TOP_LEVEL_MODULE.md §2.2)
    type: digital
    direction: input
  outbuf_en:
    description: Output buffer enable — direct dig_in bit (scan chain reopened, not decided, TOP_LEVEL_MODULE.md §2.3)
    type: digital
    direction: input
  inbuf_en:
    description: Input buffer enable — direct dig_in bit
    type: digital
    direction: input
  filter_en:
    description: gmC filter enable — direct dig_in bit
    type: digital
    direction: input
  vdiff_en:
    description: gmC differential path mode select (off/in/out/out_offset) — 2 direct dig_in bits
    type: digital
    direction: input
    width: 2
  vcmsel:
    description: V_CM source select (analog pin/internal/infrastructure) — 2 direct dig_in bits
    type: digital
    direction: input
    width: 2

# NOTE: no rst_n/reset pin. user_project_wrapper_3a.v has no per-project
# reset port (TOP_LEVEL_MODULE.md §2, the paragraph right after the pin
# table). Any block-local reset has to be derived internally.

default_conditions:
  vdd_1v2:
    description: Digital/control supply voltage
    display: Vdd (1.2V domain)
    unit: V
    typical: 1.2
  vdd_3v3:
    description: Analog supply voltage
    display: Vdd (3.3V domain)
    unit: V
    typical: 3.3
  vcm:
    description: Common-mode / bias-point voltage
    display: Vcm
    unit: V
    typical: 1.65
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance on vout
    display: Cload
    unit: pF
    typical: 10

parameters:

  # -------------------------------------------------------------
  # The one group meant to be real today. Runs against whatever DUT is
  # currently in sg13cmos5l_cm_ip__single2diff2single.sch — currently a
  # gutted boundary-only schematic (no internal blocks) — the point is
  # pin-level sanity, not circuit performance.
  # -------------------------------------------------------------
  dc_connectivity:
    spec:
      Vout_dc:
        display: DC output level at vout
        description: Operating-point voltage at vout, sanity check that the pin is driven and not floating
        unit: V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vcm_dc:
        display: DC level at vcm pin
        description: Operating-point voltage at vcm
        unit: V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_dc.sch  # NOT YET AUTHORED — see note below
        format: ascii
        suffix: .data
        variables: [Vout_dc, Vcm_dc]
    plot:
      Vout_dc_vs_vdd:
        type: xyplot
        xaxis: vdd_1v2
        yaxis: Vout_dc
        limits: auto
    conditions:
      vdd_1v2:
        typical: 1.2
      vdd_3v3:
        typical: 3.3
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        typical: 27

  # -------------------------------------------------------------
  # Placeholder groups below: structurally complete, no testbench
  # template exists yet, `minimum`/`maximum: any` throughout. Fill in
  # once the S2D input buffer / D2S output buffer schematics exist.
  # -------------------------------------------------------------

  gain_bandwidth:
    spec:
      Adm_dB:
        display: Differential gain, vin to vout
        description: Small-signal gain through S2D buffer -> internal differential path -> D2S buffer, gmC stage bypassed
        unit: dB
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      fcu:
        display: Upper -3dB cut-off frequency
        description: Upper -3dB cut-off frequency, vin to vout
        unit: Hz
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_ac.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Adm_dB, fcu]
    plot:
      Adm_dB_vs_vdd:
        type: xyplot
        xaxis: vdd_3v3
        yaxis: Adm_dB
        limits: auto
      Adm_dB_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Adm_dB
        limits: auto
    conditions:
      vdd_3v3:
        typical: 3.3
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        typical: 27
      cload:
        typical: 10

  offset_noise:
    spec:
      Vos:
        display: Input-referred offset
        description: DC offset referred to vin, buffers enabled, filter bypassed
        unit: mV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vn_out:
        display: Output-referred noise
        description: Integrated output-referred noise, vin to vout
        unit: uV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_noise.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Vos, Vn_out]
    plot:
      Vos_mc:
        type: histogram
        xaxis: Vos
    conditions:
      vdd_3v3:
        typical: 3.3
      corner_mos:
        typical: tt_stat
      corner_r:
        typical: stat
      iterations:
        description: Monte Carlo iterations
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1

  psrr:
    spec:
      PSRR_dB:
        display: Power-supply rejection ratio
        description: PSRR from vdd_3v3 to vout — directly relevant to TOP_LEVEL_MODULE.md §4's domain-split question
        unit: dB
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_psrr.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [PSRR_dB]
    plot:
      PSRR_dB_vs_vdd:
        type: xyplot
        xaxis: vdd_3v3
        yaxis: PSRR_dB
        limits: auto
    conditions:
      vdd_3v3:
        typical: 3.3
      temp:
        typical: 27

  vcm_reference:
    spec:
      Vcm_accuracy:
        display: V_CM accuracy vs. vdd_3v3/2
        description: Deviation of the internal V_CM reference from vdd_3v3/2, internal mode (vcmsel), TOP_LEVEL_MODULE.md §3
        unit: mV
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
      Vcm_line_reg:
        display: V_CM line regulation
        description: dVcm/dVdd_3v3
        unit: mV/V
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_vcm.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Vcm_accuracy, Vcm_line_reg]
    plot:
      Vcm_accuracy_vs_vdd_3v3:
        type: xyplot
        xaxis: vdd_3v3
        yaxis: Vcm_accuracy
        limits: auto
    conditions:
      vdd_3v3:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]

  bias_reference:
    spec:
      Ibias_val:
        display: Bias current, internal source
        description: >-
          Placeholder only — OgueyAebischerBias has its own dedicated CACE
          deck at macros/OgueyAebischerBias/verification/cace/, this group
          exists to characterize the bias distribution NET at the top
          level (i.e. does vbp/vbn actually reach every consumer at the
          voltage the reference intended), not to duplicate that macro's
          own device-level characterization. Also covers the harness's own
          ibias/igmc/vbias as the infrastructure alternative — see
          TOP_LEVEL_MODULE.md §3, decision not yet made.
        unit: nA
        minimum: { value: any }
        typical: { value: any }
        maximum: { value: any }
    tool:
      ngspice:
        template: sg13cmos5l_cm_ip__single2diff2single_tb_bias.sch  # NOT YET AUTHORED
        format: ascii
        suffix: .data
        variables: [Ibias_val]
    plot:
      Ibias_val_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Ibias_val
        limits: auto
    conditions:
      vdd_1v2:
        typical: 1.2
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
