name: JanteStroemSpejlHV
description: Ten-output Jante current mirror mismatch characterization, thick-oxide (sg13_hv_nmos) twin
PDK: ihp-sg13cmos5l
cace_format: 5.2

authorship:
  designer: Christoph Maier
  creation_date: October 15, 2026
  license: Apache 2.0

paths:
  root: ..
  schematic: .
  netlist: netlist
  runs: runs
  documentation: docs

default_conditions:
  iterations:
    display: Monte Carlo iteration
    description: Local mismatch run index
    typical: 1

parameters:
  mirror_mismatch:
    display: Mirror mismatch
    description: Relative output-current error at VDS(out)=VGS(ref)
    tool:
      ngspice:
        template: JanteStroemSpejl_cace_mismatch.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [e01, e02, e03, e04, e05, e06, e07, e08, e09, e10]
        script: pool_mismatch.py
        script_variables: [error_all]
    variables:
      e01: {display: OUT01 relative error, unit: ""}
      e02: {display: OUT02 relative error, unit: ""}
      e03: {display: OUT03 relative error, unit: ""}
      e04: {display: OUT04 relative error, unit: ""}
      e05: {display: OUT05 relative error, unit: ""}
      e06: {display: OUT06 relative error, unit: ""}
      e07: {display: OUT07 relative error, unit: ""}
      e08: {display: OUT08 relative error, unit: ""}
      e09: {display: OUT09 relative error, unit: ""}
      e10: {display: OUT10 relative error, unit: ""}
      error_all:
        display: Relative current error
        unit: ""
    plot:
      pooled_mismatch:
        type: histogram
        xaxis: error_all
        title: JanteStroemSpejlHV pooled local mismatch
        suffix: .svg
        limits: false
    conditions:
      iterations:
        minimum: 1
        maximum: 500
        step: linear
        stepsize: 1
      iref:
        display: Reference current
        enumerate: [3u, 10u]

  mirror_rout:
    display: Mirror output resistance
    description: Relative output-current error at VDS(out)=VGS(ref)+dvds, IREF=3uA
    tool:
      ngspice:
        template: JanteStroemSpejl_cace_mismatch.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [e01, e02, e03, e04, e05, e06, e07, e08, e09, e10]
        script: pool_mismatch.py
        script_variables: [error_all]
    variables:
      error_all:
        display: Relative current error
        unit: ""
    plot:
      rout_shift:
        type: histogram
        xaxis: error_all
        title: JanteStroemSpejlHV r_out vs. local mismatch
        suffix: .svg
        limits: false
    conditions:
      iterations:
        minimum: 1
        maximum: 500
        step: linear
        stepsize: 1
      iref:
        display: Reference current
        enumerate: [3u]
      dvds:
        display: VDS(out) - VGS(ref)
        enumerate: [-0.3, 0, 0.3]
