<rect class="l0" x="0" y="0" width="2100" height="1810"/>
<text fill="#000000"  xml:space="preserve" font-size="26" transform="translate(300, 323.608)" >tb_moscv: C-V of a thick-oxide PMOS used as accumulation capacitor (gate vs S/D/well),</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" transform="translate(300, 359.165)" >X1: hv PMOS 14u x 14u, gate g against S/D/well w (accumulation); XM: cap_cmomi 31u x 31u</text>
<text fill="#000000"  xml:space="preserve" font-size="14.04" transform="translate(530.615, 495.394)" >g</text>
<text fill="#000000"  xml:space="preserve" font-size="14.04" transform="translate(762.5, 495.394)" >w</text>
<text fill="#000000"  xml:space="preserve" font-size="14.04" transform="translate(983.73, 595.394)" >g2</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(727.5, 914.443)" >GND</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(460, 690.693)" >Vg</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(460, 715.693)" >dc {1.65+vgw} ac 1</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(659.9, 479.443)" >1</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(691.25, 494.443)" >l=14u</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(691.25, 483.193)" >w=14u</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(820, 690.693)" >Vw</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(820, 715.693)" >1.65</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(960, 690.693)" >Vg2</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(960, 715.693)" >dc 0 ac 1</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 680.693)" >M</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 689.943)" >cap_cmomi</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 699.193)" >C=1.002e-12</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 708.443)" >31e-6 / 31e-6</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 717.693)" >M1 - M4</text>
<text fill="#000000"  xml:space="preserve" font-size="10.4" transform="translate(1075, 726.943)" >feed=double</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" transform="translate(305, 1004.16)" >s1</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1029.16)" >.lib cornerMOShv.lib mos_tt</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1047.06)" >.lib cornerCAP.lib cap_typ</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1064.95)" >.param vgw=0.5</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1082.84)" >.control</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1100.74)" >foreach v -1.0 -0.5 0 0.15 0.5 1.0 1.25 1.5 2.0</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1118.63)" >  alter Vg dc = $v + 1.65</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1136.52)" >  ac lin 1 1meg 1meg</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1154.42)" >  let c = -imag(i(Vg))/(2*pi*1e6)</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1172.31)" >  echo vgw = $v  C = $&amp;c</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1190.2)" >end</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1208.1)" >let cm = -imag(i(Vg2))/(2*pi*1e6)</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1225.99)" >echo MOM 31x31: C = $&amp;cm</text>
<text fill="#000000"  xml:space="preserve" font-size="15.6" style="font-family:Monospace;" transform="translate(315, 1243.88)" >.endc</text>
