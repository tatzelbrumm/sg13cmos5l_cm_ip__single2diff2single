#--------------------------------------------------------------
# CACE circuit characterization file -- DRAFT
#--------------------------------------------------------------
#
# DUT: d2s_miller_biased (../../xschem/d2s_miller_biased.sch) = d2s_miller, the
# two-stage class-AB pad driver (differential in, single-ended out, nominal gain
# 1/2, Miller compensated), plus its d2s_bias test fixture. Same pins as
# d2s_miller; the six bias nets are pins so the testbenches can perturb them.
# (A wrapper, as reference.sch is for OgueyAebischerBias: CACE's testbench
# netlisting only resolves the DUT symbol, not a second subcircuit.)
# Proof-of-concept circuit from class_ab_pad_driver.md; lives in sudelbuecher
# until it moves into macros/sg13cmos5l_IOPadDiff2Single (then: paths.schematic
# -> ../schematic/xschem, and the DUT becomes the pad-level cell).
#
# Test fixture: d2s_bias, six ideal reference currents into diode replicas.
# Wrapper and templates are generated by ../../gen_cace_templates.py.
#
# Conditions beyond PVT:
#   load:            rload (to vterm), cload, vterm
#   bias quality:    ibias_err -- common error of all six reference currents
#                    va_bias   -- their "Early voltage", R_k = va_bias / I_k
#   input:           vicm (input common mode), vref (output reference)
#
# Spec limits are PROPOSALS, set around the tt/27C numbers of results.txt
# (run_d2s.py), not requirements. "any" = report only.
#
# Run on the schematic netlist (-s schematic); the mismatch groups are vacuous
# on an extracted netlist (see the main repo's CLAUDE.md, section 5).

name:           d2s_miller_biased
description:    Class-AB pad driver + bias fixture, differential in / single-ended out, gain 1/2, Miller compensated (proof of concept)
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 2, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vinp:
    description: Differential input, positive (vout - vref = (vinp - vinn) / 2)
    type: signal
    direction: input
  vinn:
    description: Differential input, negative
    type: signal
    direction: input
  vref:
    description: Output reference (feedback pair, other gate)
    type: signal
    direction: input
  vout:
    description: Pad output (output devices = ESD clamp frames)
    type: signal
    direction: inout
  vfb:
    description: Feedback input (feedback pair gate), tied to vout in the application
    type: signal
    direction: input
  vbp:
    description: Bias, PMOS tail current sources (20 uA reference)
    type: signal
    direction: inout
  vbn:
    description: Bias, NMOS folding sinks (50 uA reference)
    type: signal
    direction: inout
  vbpc:
    description: Bias, PMOS mirror cascode
    type: signal
    direction: inout
  vbnc:
    description: Bias, NMOS folding cascode
    type: signal
    direction: inout
  vabp:
    description: Bias, class-AB control PMOS (translinear reference)
    type: signal
    direction: inout
  vabn:
    description: Bias, class-AB control NMOS (translinear reference)
    type: signal
    direction: inout

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 3.3
  vref:
    description: Output reference voltage
    display: Vref
    unit: V
    typical: 1.65
  vicm:
    description: Input common-mode voltage
    display: Vicm
    unit: V
    typical: 1.65
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  corner_c:
    description: Process corner MOM capacitor
    display: Corner C
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  rload:
    description: Load resistance, vout to vterm
    display: Rload
    unit: Ω
    typical: 1000
  vterm:
    description: Load termination voltage
    display: Vterm
    unit: V
    typical: 1.65
  cload:
    description: Load capacitance, vout to ground
    display: Cload
    unit: pF
    typical: 100
  ibias_err:
    description: Common error of the six bias reference currents
    display: Ibias error
    unit: '%'
    typical: 0
  va_bias:
    description: Early voltage of the bias reference sources (R_k = va_bias / I_k)
    display: VA bias
    unit: V
    typical: 1e12

parameters:

  #------------------------------------------------------------ DC, PVT
  dc_params:
    spec:
      Gain:
        display: Gain
        description: Small-signal gain d(vout)/d(vinp - vinn), from vd = +-0.2 V
        minimum:
          value: 0.485
        typical:
          value: 0.5
        maximum:
          value: 0.515
      Vos_out:
        display: Output offset
        description: vout - vref at vinp = vinn (systematic; random offset in mm_params)
        unit: mV
        minimum:
          value: -5
        typical:
          value: 0
        maximum:
          value: 5
      INL:
        display: Integral nonlinearity
        description: Max deviation of vout from the small-signal line, vd = +-1 V (vout = vref +- 0.5 V)
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 10
      Idd:
        display: Supply current
        description: Total vdd current at vd = 0 incl. load current, excl. the bias fixture
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 600
      IqP:
        display: Output PMOS quiescent current
        description: Drain current of XOP at vd = 0
        unit: uA
        minimum:
          value: 100
        typical:
          value: any
        maximum:
          value: 500
      IqN:
        display: Output NMOS quiescent current
        description: Drain current of XON at vd = 0
        unit: uA
        minimum:
          value: 100
        typical:
          value: any
        maximum:
          value: 500
      Imin:
        display: Minimum output device current
        description: Smaller of the two output device currents at vd = +-1 V (class-AB, no cut-off)
        unit: uA
        minimum:
          value: 20
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Idd, IqP, IqN, Imin]
    plot:
      Gain_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Gain
        limits: auto
      Gain_vs_corner_r:
        type: xyplot
        xaxis: corner_r
        yaxis: Gain
        limits: auto
      Vos_out_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Vos_out
        limits: auto
      Idd_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Idd
        limits: auto
      IqP_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: IqP
        limits: auto
      Imin_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Imin
        limits: auto
    conditions:
      vdd:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        # rhigh corners matter: gain = Gm1/Gm2 of degenerated pairs, and gm*R is not >> 1
        enumerate: [bcs, typ, wcs]
      temp:
        minimum: -40
        typical: 27
        maximum: 125

  #------------------------------------------------------------ DC, bias-source quality
  dc_bias_params:
    spec:
      Gain:
        display: Gain vs bias quality
        description: As dc_params, swept over ibias_err, va_bias and vdd
        minimum:
          value: 0.485
        typical:
          value: 0.5
        maximum:
          value: 0.515
      Vos_out:
        display: Output offset vs bias quality
        unit: mV
        minimum:
          value: -5
        typical:
          value: 0
        maximum:
          value: 5
      Idd:
        display: Supply current vs bias quality
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 600
      IqP:
        display: Output PMOS quiescent current vs bias quality
        unit: uA
        minimum:
          value: 100
        typical:
          value: any
        maximum:
          value: 500
      Imin:
        display: Minimum output device current vs bias quality
        unit: uA
        minimum:
          value: 20
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Idd, IqP, IqN, Imin]
    plot:
      Idd_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: Idd
        limits: auto
      IqP_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: IqP
        limits: auto
      Vos_out_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: Vos_out
        limits: auto
      IqP_vs_va_bias:
        type: xyplot
        xaxis: va_bias
        yaxis: IqP
        limits: auto
    conditions:
      vdd:
        enumerate: [3.0, 3.6]
      ibias_err:
        enumerate: [-40, -20, 0, 20, 40]
      va_bias:
        enumerate: [10, 100, 1e12]
      corner_mos:
        typical: tt
      temp:
        typical: 27

  #------------------------------------------------------------ DC, load
  dc_load_params:
    spec:
      Gain:
        display: Gain vs load
        description: rload to vterm; vterm = 0 is the sourcing-only case
        minimum:
          value: any
        typical:
          value: 0.5
        maximum:
          value: any
      INL:
        display: Integral nonlinearity vs load
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 10
      Imin:
        display: Minimum output device current vs load
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Idd, IqP, IqN, Imin]
    plot:
      Gain_vs_rload:
        type: xyplot
        xaxis: rload
        yaxis: Gain
        limits: auto
      INL_vs_rload:
        type: xyplot
        xaxis: rload
        yaxis: INL
        limits: auto
    conditions:
      rload:
        enumerate: [50, 1000, 10000, 1e9]
      vterm:
        enumerate: [0, 1.65]
      corner_mos:
        typical: tt
      temp:
        typical: 27

  #------------------------------------------------------------ loop gain, PVT
  loop_params:
    spec:
      T0:
        display: DC loop gain
        description: T = -v(vout)/v(fb) at 10 Hz, loop broken at the vfb gate
        unit: dB
        minimum:
          value: 40
        typical:
          value: any
        maximum:
          value: any
      fc:
        display: Loop crossover frequency
        unit: MHz
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
      PM:
        display: Phase margin
        unit: °
        minimum:
          value: 45
        typical:
          value: 60
        maximum:
          value: any
      GM:
        display: Gain margin
        description: 1000 dB means the phase never reaches -180 deg
        unit: dB
        minimum:
          value: 10
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0, fc, PM, GM]
    plot:
      PM_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: PM
        limits: auto
      fc_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: fc
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_c:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 125

  #------------------------------------------------------------ loop gain, load
  loop_load_params:
    spec:
      fc:
        display: Loop crossover frequency vs load
        unit: MHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      PM:
        display: Phase margin vs load
        unit: °
        minimum:
          value: 45
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0, fc, PM, GM]
    plot:
      PM_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: PM
        limits: auto
    conditions:
      cload:
        enumerate: [10, 100, 300, 1000]
      rload:
        enumerate: [1000, 1e9]
      corner_mos:
        typical: tt
      temp:
        typical: 27

  #------------------------------------------------------------ loop gain, bias quality and MOM corner
  loop_bias_params:
    spec:
      PM:
        display: Phase margin vs bias error and MOM corner
        unit: °
        minimum:
          value: 45
        typical:
          value: any
        maximum:
          value: any
      fc:
        display: Crossover vs bias error and MOM corner
        unit: MHz
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0, fc, PM, GM]
    plot:
      PM_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: PM
        limits: auto
      fc_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: fc
        limits: auto
    conditions:
      ibias_err:
        enumerate: [-40, -20, 0, 20, 40]
      corner_c:
        enumerate: [bcs, typ, wcs]
      corner_mos:
        typical: tt
      temp:
        typical: 27

  #------------------------------------------------------------ closed-loop AC
  ac_params:
    spec:
      Acl_dB:
        display: Closed-loop gain at 1 kHz
        unit: dB
        minimum:
          value: any
        typical:
          value: -6.02
        maximum:
          value: any
      f3dB:
        display: Closed-loop -3 dB bandwidth
        unit: MHz
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
      PSRR_1k:
        display: PSRR at 1 kHz (output-referred)
        description: -20 log10 |vout/vdd|
        unit: dB
        minimum:
          value: 40
        typical:
          value: any
        maximum:
          value: any
      PSRR_100k:
        display: PSRR at 100 kHz (output-referred)
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      CMRR_1k:
        display: CMRR at 1 kHz
        description: A_dm / A_cm, input common mode vicm
        unit: dB
        minimum:
          value: 50
        typical:
          value: any
        maximum:
          value: any
      Zout_1k:
        display: Closed-loop output impedance at 1 kHz
        unit: Ω
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1
      Zout_1M:
        display: Closed-loop output impedance at 1 MHz
        unit: Ω
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [Acl_dB, f3dB, PSRR_1k, PSRR_100k, CMRR_1k, Zout_1k, Zout_1M]
    plot:
      PSRR_1k_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: PSRR_1k
        limits: auto
    conditions:
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        typical: 27

  #------------------------------------------------------------ step response
  tran_params:
    spec:
      SR_rise:
        display: Rising slew rate (10-90 %)
        unit: V/us
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
      SR_fall:
        display: Falling slew rate (90-10 %)
        unit: V/us
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
      Overshoot:
        display: Overshoot
        unit: '%'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 10
      ts_rise:
        display: Settling time to 1 %, rising
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
      ts_fall:
        display: Settling time to 1 %, falling
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
    tool:
      ngspice:
        template: d2s_miller_biased_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [SR_rise, SR_fall, Overshoot, ts_rise, ts_fall]
    plot:
      SR_rise_vs_vstep:
        type: xyplot
        xaxis: vstep
        yaxis: SR_rise
        limits: auto
      ts_rise_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: ts_rise
        limits: auto
    conditions:
      vstep:
        description: Differential input step, -vstep -> +vstep (output step ~ vstep)
        display: Vstep
        unit: V
        enumerate: [0.5, 2.0]
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        typical: 27

  #------------------------------------------------------------ distortion
  thd_params:
    spec:
      THD:
        display: Total harmonic distortion (h2..h7)
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: -40
      Vout_amp:
        display: Output fundamental amplitude
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_thd.sch
        format: ascii
        suffix: .data
        variables: [THD, Vout_amp]
    plot:
      THD_vs_fin:
        type: xyplot
        xaxis: fin
        yaxis: THD
        limits: auto
    conditions:
      fin:
        description: Input sine frequency
        display: fin
        unit: kHz
        enumerate: [1, 10, 100]
      vdamp:
        description: Differential input sine amplitude (output amplitude ~ vdamp / 2)
        display: Vd amplitude
        unit: V
        enumerate: [1, 2]
      corner_mos:
        typical: tt
      temp:
        typical: 27

  #------------------------------------------------------------ noise
  noise_params:
    spec:
      En_1k:
        display: Output noise density at 1 kHz
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      En_100k:
        display: Output noise density at 100 kHz
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vn_int:
        display: Integrated output noise, 10 Hz - 10 MHz
        unit: uV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_noise.sch
        format: ascii
        suffix: .data
        variables: [En_1k, En_100k, Vn_int]
    conditions:
      corner_mos:
        enumerate: [ss, tt, ff]
      temp:
        typical: 27

  #------------------------------------------------------------ output drive
  drive_params:
    spec:
      Vout_max:
        display: Maximum output voltage into load
        description: vd = +3 V (overdriven), rload to vterm
        unit: V
        minimum:
          value: 2.8
        typical:
          value: any
        maximum:
          value: any
      Vout_min:
        display: Minimum output voltage into load
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.5
      Isc_src:
        display: Short-circuit current, sourcing
        description: vout held at vforce through 1 mohm, vd = +3 V
        unit: mA
        minimum:
          value: 5
        typical:
          value: any
        maximum:
          value: any
      Isc_snk:
        display: Short-circuit current, sinking
        unit: mA
        minimum:
          value: 5
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: d2s_miller_biased_tb_drive.sch
        format: ascii
        suffix: .data
        variables: [Vout_max, Vout_min, Isc_src, Isc_snk]
    plot:
      Vout_max_vs_rload:
        type: xyplot
        xaxis: rload
        yaxis: Vout_max
        limits: auto
    conditions:
      rload:
        enumerate: [50, 1000, 1e9]
      corner_mos:
        enumerate: [ss, tt, ff]
      temp:
        typical: 27

  #------------------------------------------------------------ mismatch Monte Carlo
  mm_params:
    spec:
      Vos_out:
        display: Output offset - Mismatch
        unit: mV
        minimum:
          value: -10
        typical:
          value: any
        maximum:
          value: 10
      Gain:
        display: Gain - Mismatch
        minimum:
          value: 0.485
        typical:
          value: any
        maximum:
          value: 0.515
      IqP:
        display: Output PMOS quiescent current - Mismatch
        unit: uA
        minimum:
          value: 100
        typical:
          value: any
        maximum:
          value: 500
    tool:
      ngspice:
        template: d2s_miller_biased_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Idd, IqP, IqN, Imin]
        script: d2s_miller_mc.py
        script_variables: [Vos_out_arr, Gain_arr, IqP_arr]
    plot:
      Vos_out_mm:
        type: histogram
        xaxis: Vos_out_arr
      Gain_mm:
        type: histogram
        xaxis: Gain_arr
      IqP_mm:
        type: histogram
        xaxis: IqP_arr
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      corner_c:
        typical: typ_mismatch
      temp:
        typical: 27

  #------------------------------------------------------------ process Monte Carlo
  mc_params:
    spec:
      Vos_out:
        display: Output offset - Process MC
        unit: mV
        minimum:
          value: -10
        typical:
          value: any
        maximum:
          value: 10
      Gain:
        display: Gain - Process MC
        minimum:
          value: 0.485
        typical:
          value: any
        maximum:
          value: 0.515
      IqP:
        display: Output PMOS quiescent current - Process MC
        unit: uA
        minimum:
          value: 100
        typical:
