#--------------------------------------------------------------
# CACE circuit characterization file -- DRAFT
#--------------------------------------------------------------
#
# DUT: s2d_mpdda_biased (../../xschem/s2d_mpdda_biased.sch) = s2d_mpdda, the pad input buffer
# (single-ended in, fully differential out, voutp - voutn = 2 (vin - vref), output common mode
# = vcm), plus its s2d_bias_lp test fixture. Same pins as s2d_mpdda; the four bias nets are pins so
# the templates can perturb them. Same arrangement as d2s_miller_biased in
# ../../../class_ab_pad_driver/verification/cace (CACE's testbench netlisting resolves only the
# DUT symbol, not a second subcircuit).
# Proof-of-concept circuit from ../../s2d_input_buffer.md; lives in sudelbuecher until it moves
# into macros/sg13cmos5l_IOPadSingle2Diff (then: paths.schematic -> ../schematic/xschem).
#
# Test fixture: s2d_bias_lp, four ideal reference currents into the bias diodes.
#
# Conditions beyond PVT:
#   reference:     vref (pad reference), vcm (internal common mode); default 1.2 V each, the value
#                  s2d_input_buffer.md proposes (1.65 V needs vdd >= 3.3 V)
#   load:          cload, external capacitance per output on top of the built-in 2 x 12 x 12 um MOS
#                  capacitors (default 0.5 pF: wiring plus the next stage's unit gates)
#   bias quality:  ibias_err -- common error of the four reference currents
#                  va_bias   -- their "Early voltage", R_k = va_bias / I_k
#   stimulus:      umax (DC sweep +-u), vstep (step size of u)
#
# Spec limits are PROPOSALS from the tt numbers in ../../sim/results_s2d.txt, not requirements.
# "any" = report only. Run on the schematic netlist (-s schematic); the mismatch groups are vacuous
# on an extracted netlist (main repo CLAUDE.md, section 5).

name:           s2d_mpdda_biased
description:    Pad input buffer + bias fixture, single-ended in / fully differential out, gain 2, load compensated (proof of concept)
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 20, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Positive analog power supply (slot vdd_3v3)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground (slot vss_3v3)
    type: ground
    direction: inout
  vin:
    description: Pad input, from IOPadAnalog padres (behind 586.9 ohm and the secondary clamps)
    type: signal
    direction: input
  vref:
    description: Pad reference (input units, other gate); vin = vref +- 0.5 V
    type: signal
    direction: input
  vcm:
    description: Internal common mode (feedback and CMFB units); gate only
    type: signal
    direction: input
  voutp:
    description: Differential output, positive (voutp - voutn = 2 (vin - vref))
    type: signal
    direction: output
  voutn:
    description: Differential output, negative
    type: signal
    direction: output
  vfbp:
    description: Feedback / CMFB sense, tied to voutp in the application
    type: signal
    direction: input
  vfbn:
    description: Feedback / CMFB sense, tied to voutn in the application
    type: signal
    direction: input
  vbp:
    description: Bias, PMOS unit tails (5 uA reference)
    type: signal
    direction: inout
  vbn:
    description: Bias, NMOS fold sinks (5 uA reference)
    type: signal
    direction: inout
  vbpc:
    description: Bias, PMOS load and diode cascodes (2 uA reference)
    type: signal
    direction: inout
  vbnc:
    description: Bias, NMOS fold cascodes (2 uA reference)
    type: signal
    direction: inout

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 3.3
  vref:
    description: Pad reference voltage
    display: Vref
    unit: V
    typical: 1.2
  vcm:
    description: Internal common-mode voltage
    display: Vcm
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor (rhigh)
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: External load capacitance per output, to ground
    display: Cload
    unit: pF
    typical: 0.5
  ibias_err:
    description: Common error of the four bias reference currents
    display: Ibias error
    unit: '%'
    typical: 0
  va_bias:
    description: Early voltage of the bias reference sources (R_k = va_bias / I_k)
    display: VA bias
    unit: V
    typical: 1e12

parameters:

  #------------------------------------------------------------ DC, PVT
  dc_params:
    spec:
      Gain:
        display: Gain
        description: Small-signal gain d(voutp - voutn)/d(vin - vref), from u = +-0.1 V (ideal 2)
        minimum:
          value: 1.99
        typical:
          value: 2
        maximum:
          value: 2.01
      Vos_in:
        display: Input offset (systematic)
        description: vd(u = 0) / Gain; random offset in mm_params
        unit: mV
        minimum:
          value: -1
        typical:
          value: 0
        maximum:
          value: 1
      INL:
        display: Integral nonlinearity
        description: Max deviation from the small-signal line, u = +-0.5 V, referred to the input
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2
      Vcm_err:
        display: Output common-mode error
        description: (voutp + voutn)/2 - vcm at u = 0 (systematic; random part in mm_params)
        unit: mV
        minimum:
          value: -30
        typical:
          value: any
        maximum:
          value: 30
      Idd:
        display: Supply current
        description: vdd current at u = 0, s2d_mpdda plus the fixture's 14 uA of diode current
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 125
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, Vos_in, INL, Vcm_err, Idd]
    plot:
      INL_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: INL
        limits: auto
      INL_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: INL
        limits: auto
      Gain_vs_corner_r:
        type: xyplot
        xaxis: corner_r
        yaxis: Gain
        limits: auto
      Vcm_err_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Vcm_err
        limits: auto
      Idd_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Idd
        limits: auto
    conditions:
      vdd:
        minimum: 3.0
        typical: 3.3
        maximum: 3.6
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        enumerate: [bcs, typ, wcs]
      temp:
        minimum: -40
        typical: 27
        maximum: 125

  #------------------------------------------------------------ DC, signal window
  range_params:
    spec:
      Gain:
        display: Gain vs vref and vcm
        description: As dc_params, at vdd = 3.0 V, swept over the pad reference and the internal common mode
        minimum:
          value: any
        typical:
          value: 2
        maximum:
          value: any
      INL:
        display: Integral nonlinearity vs vref and vcm
        description: Shows the PMOS-unit headroom limit, unit gates <= about vdd - 1.3 V at ss / -40 C
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      Vcm_err:
        display: Output common-mode error vs vref and vcm
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, null, INL, Vcm_err, null]
    plot:
      INL_vs_vcm:
        type: xyplot
        xaxis: vcm
        yaxis: INL
        limits: auto
      Gain_vs_vref:
        type: xyplot
        xaxis: vref
        yaxis: Gain
        limits: auto
    conditions:
      vdd:
        typical: 3.0
      vref:
        enumerate: [0.5, 0.8, 1.2, 1.65]
      vcm:
        enumerate: [1.0, 1.2, 1.4, 1.65]
      corner_mos:
        enumerate: [ss, tt, ff]
      temp:
        enumerate: [-40, 125]

  #------------------------------------------------------------ DC, bias-source quality
  dc_bias_params:
    spec:
      Gain:
        display: Gain vs bias quality
        description: As dc_params, swept over ibias_err and va_bias
        minimum:
          value: 1.99
        typical:
          value: 2
        maximum:
          value: 2.01
      Vcm_err:
        display: Output common-mode error vs bias quality
        unit: mV
        minimum:
          value: -30
        typical:
          value: any
        maximum:
          value: 30
      Idd:
        display: Supply current vs bias quality
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 200
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, null, null, Vcm_err, Idd]
    plot:
      Idd_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: Idd
        limits: auto
      Vcm_err_vs_ibias_err:
        type: xyplot
        xaxis: ibias_err
        yaxis: Vcm_err
        limits: auto
    conditions:
      ibias_err:
        enumerate: [-0.4, -0.2, 0, 0.2, 0.4]
      va_bias:
        enumerate: [1e12, 30, 10]

  #------------------------------------------------------------ loop gain
  loop_params:
    spec:
      T0dm:
        display: DC loop gain, differential
        unit: dB
        minimum:
          value: 60
        typical:
          value: any
        maximum:
          value: any
      fcdm:
        display: Crossover, differential
        unit: MHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      PMdm:
        display: Phase margin, differential
        unit: °
        minimum:
          value: 60
        typical:
          value: any
        maximum:
          value: any
      GMdm:
        display: Gain margin, differential
        unit: dB
        minimum:
          value: 10
        typical:
          value: any
        maximum:
          value: any
      T0cm:
        display: DC loop gain, common mode
        unit: dB
        minimum:
          value: 50
        typical:
          value: any
        maximum:
          value: any
      fccm:
        display: Crossover, common mode
        unit: MHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      PMcm:
        display: Phase margin, common mode
        unit: °
        minimum:
          value: 55
        typical:
          value: any
        maximum:
          value: any
      GMcm:
        display: Gain margin, common mode
        unit: dB
        minimum:
          value: 10
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0dm, fcdm, PMdm, GMdm, T0cm, fccm, PMcm, GMcm]
    plot:
      PMcm_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: PMcm
        limits: auto
      fcdm_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: fcdm
        limits: auto
      PMcm_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: PMcm
        limits: auto
    conditions:
      cload:
        enumerate: [0.001, 0.5, 2, 10]
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        enumerate: [-40, 27, 125]

  #------------------------------------------------------------ closed-loop AC
  ac_params:
    spec:
      Acl_dB:
        display: Closed-loop gain at 1 kHz
        unit: dB
        minimum:
          value: any
        typical:
          value: 6.02
        maximum:
          value: any
      f3dB:
        display: Closed-loop -3 dB bandwidth
        unit: MHz
        minimum:
          value: 1
        typical:
          value: any
        maximum:
          value: any
      CMvdd_1k:
        display: Output common-mode response to vdd at 1 kHz
        description: 20 log |vc / vdd|; the differential rejections need mismatch (ac_mm_params)
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: -30
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [Acl_dB, f3dB, null, null, null, null, null, CMvdd_1k]
    plot:
      f3dB_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: f3dB
        limits: auto
    conditions:
      # the 1 MHz limit is for 0.5 pF; the load dependence is in loop_params (fc) and tran_params
      cload:
        typical: 0.5
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        enumerate: [-40, 27, 125]

  #------------------------------------------------------------ rejection under mismatch
  ac_mm_params:
    spec:
      PSRRp_1k:
        display: PSRR vdd at 1 kHz (input-referred), mismatch
        unit: dB
        minimum:
          value: 60
        typical:
          value: any
        maximum:
          value: any
      PSRRp_100k:
        display: PSRR vdd at 100 kHz (input-referred), mismatch
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      PSRRn_1k:
        display: PSRR vss at 1 kHz (input-referred), mismatch
        unit: dB
        minimum:
          value: 60
        typical:
          value: any
        maximum:
          value: any
      PSRRn_100k:
        display: PSRR vss at 100 kHz (input-referred), mismatch
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      CMRR_1k:
        display: CMRR at 1 kHz (vin and vref together), mismatch
        unit: dB
        minimum:
          value: 70
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [null, null, PSRRp_1k, PSRRp_100k, PSRRn_1k, PSRRn_100k, CMRR_1k, null]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 30
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        typical: 27

  #------------------------------------------------------------ step response
  tran_params:
    spec:
      t_rise:
        display: Rise time 10-90 %
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      t_settle:
        display: Settling time to 1 %
        unit: ns
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
      Overshoot:
        display: Overshoot
        unit: '%'
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 5
      Vcm_dev:
        display: Largest output common-mode deviation during the step
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 50
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [t_rise, t_settle, Overshoot, Vcm_dev]
    plot:
      t_settle_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: t_settle
        limits: auto
    conditions:
      # the 1 us limit is for 0.5 pF or less (2 pF: 1.13 us, results_s2d.txt section 6)
      cload:
        enumerate: [0.001, 0.5]
      corner_mos:
        enumerate: [ss, tt, ff]
      temp:
        enumerate: [-40, 27, 125]

  #------------------------------------------------------------ noise
  noise_params:
    spec:
      En_1k:
        display: Input noise density at 1 kHz
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
      En_100k:
        display: Input noise density at 100 kHz
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 250
      Vn_out:
        display: Differential output noise, 10 Hz - 10 MHz
        unit: uV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_noise.sch
        format: ascii
        suffix: .data
        variables: [En_1k, En_100k, Vn_out]
    plot:
      En_1k_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: En_1k
        limits: auto
    conditions:
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        enumerate: [-40, 27, 125]

  #------------------------------------------------------------ mismatch Monte Carlo
  mm_params:
    spec:
      Vos_in:
        display: Input offset - Mismatch
        unit: mV
        minimum:
          value: -20
        typical:
          value: any
        maximum:
          value: 20
      Gain:
        display: Gain - Mismatch
        minimum:
          value: 1.93
        typical:
          value: any
        maximum:
          value: 2.07
      Vcm_err:
        display: Output common-mode error - Mismatch
        unit: mV
        minimum:
          value: -60
        typical:
          value: any
        maximum:
          value: 60
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_in, INL, Vcm_err, Idd]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        typical: 27

  #------------------------------------------------------------ process Monte Carlo
  mc_params:
    spec:
      Vos_in:
        display: Input offset - Process MC
        unit: mV
        minimum:
          value: -5
        typical:
          value: any
        maximum:
          value: 5
      Gain:
        display: Gain - Process MC
        minimum:
          value: 1.99
        typical:
          value: any
        maximum:
          value: 2.01
      Vcm_err:
        display: Output common-mode error - Process MC
        unit: mV
        minimum:
          value: -30
        typical:
          value: any
        maximum:
          value: 30
    tool:
      ngspice:
        template: s2d_mpdda_biased_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_in, INL, Vcm_err, Idd]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 30
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_stat
      # rhigh stays at typ: the PDK's res_stat draws its "global" sheet-resistance deviation
      # (nsig_rsh = agauss(0,1,1), 5.1 % sigma) in a .model inside the rhigh subcircuit, so in ngspice
      # every instance draws its own, which acts as 5 % mismatch between the units (gain 1.83...2.36 in
      # the first run; d2s_miller's first run shows the same). See README.md.
      corner_r:
        typical: typ
      temp:
        typical: 27
