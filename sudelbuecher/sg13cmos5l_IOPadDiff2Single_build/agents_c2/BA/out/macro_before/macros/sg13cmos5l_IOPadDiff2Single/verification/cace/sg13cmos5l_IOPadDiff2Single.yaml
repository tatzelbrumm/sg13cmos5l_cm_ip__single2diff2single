#--------------------------------------------------------------
# CACE circuit characterization file: sg13cmos5l_IOPadDiff2Single
#--------------------------------------------------------------
# Differential-in, single-ended-out buffered pad: class-AB driver d2s_mpdda_pd with its output stage
# d2s_out_p / d2s_out_n and CMA / CMB at pad level (gain 1/2, Miller compensated, OP / ON = the pad's ESD clamp frames), selectable bias bias_gen_pd + bias_tree_pd (one bias_sel_pd until 2026-10-28), fail-safe enable
# en_ctrl_3v3, IHP primary diodes DCNDiode / DCPDiode. Everything on the ring rails iovdd / iovss;
# the 1.2 V core ring vdd only feeds the level shifters' input inverters.
# vfb is tied to pad inside the cell, so the loop cannot be opened here: loop gain / phase margin are
# characterized on the driver (results_improvements.txt: 78.9 dB, 1.37 MHz, 72.4 deg at tt), and this
# file checks stability through the closed-loop peaking (ac) and the step overshoot (tran).
#
# Conditions: sel = bias selection (0 harness ibias, 1 Oguey-Aebischer, 2 bandgap, 3 both);
# pdstate (pd group) = 0 en_1v2 low, 1 slot vdd_1v2 off, 2 slot vdd_3v3 off, 3 chip core 1.2 V off
# (core ring, slot vdd_1v2 and en_1v2 all 0).
# Harness ibias = sourced current from a PMOS mirror (the harness iDAC: 250 nA steps, code 20 = 5 uA).
#
# LIMITS ARE PROPOSALS: worst case of the first full run (2026-10-20) plus margin, not requirements;
# specified load range 10 ... 300 pF (1 nF: ac_1nF_params, report only). INL is specified for iovdd >= 3.3 V
# (dc_3v0_params reports it at 3.0 V: the input pairs run out of headroom); sel = 11 (both cores) is a
# test mode, reported in dc_sel3_params only. See README.md.
# Run on the schematic netlist only (-s schematic); mismatch is vacuous on extracted netlists.

name:           sg13cmos5l_IOPadDiff2Single
description:    Differential-in, single-ended-out class-AB buffered pad with selectable bias and fail-safe enable
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 20, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  iovdd:
    description: IO ring supply (front end, bias, output stage OP)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  iovss:
    description: IO ring ground (output stage ON, front end, bias)
    type: ground
    direction: inout
  vdd:
    description: 1.2 V core ring (level-shifter input inverters only)
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.32
  vss:
    description: core ring ground
    type: ground
    direction: inout
  pad:
    description: Pad (bond pad, drains of the clamp-frame output devices, primary diodes)
    type: signal
    direction: inout
  vinp:
    description: Differential input, positive (pad - vref = (vinp - vinn) / 2)
    type: signal
    direction: input
  vinn:
    description: Differential input, negative
    type: signal
    direction: input
  vref:
    description: Output reference voltage
    type: signal
    direction: input
  ibias:
    description: Harness bias current input (sourced into the cell, 5 uA nominal)
    type: signal
    direction: input
  en_1v2:
    description: Enable, 1.2 V logic, active high
    type: digital
    direction: input
  sel0_1v2:
    description: Bias select bit 0, 1.2 V logic
    type: digital
    direction: input
  sel1_1v2:
    description: Bias select bit 1, 1.2 V logic
    type: digital
    direction: input
  vdd1v2_sense:
    description: The slot's gated 1.2 V supply (presence sense)
    type: signal
    direction: input
  vdd3v3_sense:
    description: The slot's gated 3.3 V supply (presence sense)
    type: signal
    direction: input

default_conditions:
  vdd:
    description: IO ring supply voltage
    display: IOVDD
    unit: V
    typical: 3.3
  vddl:
    description: Core ring supply voltage
    display: VDD core
    unit: V
    typical: 1.2
  vref:
    description: Output reference voltage
    display: Vref
    unit: V
    typical: 1.65
  vicm:
    description: Input common-mode voltage
    display: Vicm
    unit: V
    typical: 1.65
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  corner_pnp:
    description: Process corner PNP
    display: Corner PNP
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  sel:
    description: Bias selection (0 harness, 1 OA, 2 bandgap, 3 both)
    display: Bias select
    typical: 0
  ibias:
    description: Harness bias current
    display: Ibias
    unit: A
    typical: 5e-06
  rload:
    description: Load resistance, pad to vterm
    display: Rload
    unit: Ω
    typical: 1000
  vterm:
    description: Load termination voltage
    display: Vterm
    unit: V
    typical: 1.65
  cload:
    description: Load capacitance, pad to ground
    display: Cload
    unit: F
    typical: 1e-10

parameters:

  dc_params:
    spec:
      Gain:
        display: Gain
        description: Small-signal gain d(pad)/d(vinp - vinn), from vd = +-0.2 V
        minimum:
          value: 0.49
        typical:
          value: any
        maximum:
          value: 0.51
      Vos_out:
        display: Output offset
        description: pad - vref at vinp = vinn (systematic)
        unit: mV
        minimum:
          value: -5
        typical:
          value: any
        maximum:
          value: 5
      INL:
        display: Integral nonlinearity
        description: Max deviation from the small-signal line, vd = +-1 V
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 10
      Iio:
        display: IO ring supply current
        description: Current from iovdd, vd = 0
        unit: uA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 400
      Icore:
        display: Core ring supply current
        description: Current from the 1.2 V core ring, vd = 0
        unit: nA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 100
      IqP:
        display: Quiescent current OP
        description: Drain current of the PMOS output device, vd = 0
        unit: uA
        minimum:
          value: 150
        typical:
          value: any
        maximum:
          value: 300
      IqN:
        display: Quiescent current ON
        description: Drain current of the NMOS output device, vd = 0
        unit: uA
        minimum:
          value: 150
        typical:
          value: any
        maximum:
          value: 300
      Imin:
        display: Minimum output-device current
        description: The smaller of the two output currents at vd = +-1 V (class-AB floor)
        unit: uA
        minimum:
          value: 30
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Iio, Icore, IqP, IqN, Imin]
    plot:
