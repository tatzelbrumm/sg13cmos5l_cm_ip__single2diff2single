  thd_params:
    spec:
      THD:
        display: THD
        description: Harmonics 2..7, 10 kHz, into 1 kOhm || 100 pF
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: -35
      Vout_amp:
        display: Output amplitude
        description: Fundamental at the pad
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_thd.sch
        format: ascii
        suffix: .data
        variables: [THD, Vout_amp]
    plot:
      THD_vs_vdamp:
        type: xyplot
        xaxis: vdamp
        yaxis: THD
    conditions:
      vdamp:
        description: Differential input amplitude
        display: Vd amplitude
        unit: V
        enumerate: [0.5, 1, 1.5]

  noise_params:
    spec:
      En_1k:
        display: Output noise 1 kHz
        description: Output-referred spot noise
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
      En_100k:
        display: Output noise 100 kHz
        description: Output-referred spot noise
        unit: nV/rtHz
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 200
      Vn_int:
        display: Integrated output noise
        description: 10 Hz .. 10 MHz
        unit: uV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 300
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_noise.sch
        format: ascii
        suffix: .data
        variables: [En_1k, En_100k, Vn_int]
    plot:
      Vn_int_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Vn_int
    conditions:
      temp:
        enumerate: [-40, 27, 125]

  drive_params:
    spec:
      Vout_max:
        display: Max output
        description: vd = +3 V, 1 kOhm to 1.65 V
        unit: V
        minimum:
          value: 3.0
        typical:
          value: any
        maximum:
          value: any
      Vout_min:
        display: Min output
        description: vd = -3 V, 1 kOhm to 1.65 V
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.9
      Isc_src:
        display: Short-circuit source current
        description: pad shorted to 1.65 V, vd = +3 V
        unit: mA
        minimum:
          value: 20
        typical:
          value: any
        maximum:
          value: any
      Isc_snk:
        display: Short-circuit sink current
        description: pad shorted to 1.65 V, vd = -3 V
        unit: mA
        minimum:
          value: 20
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_drive.sch
        format: ascii
        suffix: .data
        variables: [Vout_max, Vout_min, Isc_src, Isc_snk]
    plot:
      Isc_src_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Isc_src
    conditions:
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      temp:
        enumerate: [-40, 125]

  pd_params:
    spec:
      Iio_pd:
        display: IO ring current, off
        description: Current from iovdd in each power-down state
        unit: nA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 1000
      Icore_pd:
        display: Core ring current, off
        description: Current from the 1.2 V core ring
        unit: nA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 100
      Ipad_pd:
        display: Pad leakage, off
        description: Current into the pad from the source holding it
        unit: nA
        minimum:
          value: -100
        typical:
          value: any
        maximum:
          value: 100
      Is12_pd:
        display: vdd1v2_sense current
        description: Current into the sense input
        unit: nA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2000
      Is33_pd:
        display: vdd3v3_sense current
        description: Current into the sense input
        unit: nA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2000
      Ven3:
        display: Internal enable
        description: en_3v3 (must be low in every power-down state)
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.1
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_pd.sch
        format: ascii
        suffix: .data
        variables: [Iio_pd, Icore_pd, Ipad_pd, Is12_pd, Is33_pd, Ven3]
    plot:
      Iio_pd_vs_pdstate:
        type: xyplot
        xaxis: pdstate
        yaxis: Iio_pd
      Ipad_pd_vs_vpad:
        type: xyplot
        xaxis: vpad
        yaxis: Ipad_pd
      Ven3_vs_pdstate:
        type: xyplot
        xaxis: pdstate
        yaxis: Ven3
    conditions:
      pdstate:
        description: Power-down state (0 en low, 1 slot vdd_1v2 off, 2 slot vdd_3v3 off, 3 chip core 1.2 V off)
        display: PD state
        enumerate: [0, 1, 2, 3]
      vpad:
        description: Pad voltage held by an external source
        display: Vpad
        unit: V
        enumerate: [0, 1.65, 3.3]
      corner_mos:
        enumerate: [tt, ff]
      temp:
        enumerate: [27, 125]

  enable_params:
    spec:
      t_on:
        display: Turn-on time
        description: en_1v2 rising to pad within 1 mV of its final value
        unit: us
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 5
      Glitch_max:
        display: Enable glitch, positive
        description: Max of pad - vref after enable
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 400
      Glitch_min:
        display: Enable glitch, negative
        description: Min of pad - vref after enable
        unit: mV
        minimum:
          value: -400
        typical:
          value: any
        maximum:
          value: any
      Iio_end:
        display: IO ring current after start-up
        description: At the end of the transient
        unit: uA
        minimum:
          value: 200
        typical:
          value: any
        maximum:
          value: 400
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_enable.sch
        format: ascii
        suffix: .data
        variables: [t_on, Glitch_max, Glitch_min, Iio_end]
    plot:
      t_on_vs_sel:
        type: xyplot
        xaxis: sel
        yaxis: t_on
      Glitch_max_vs_sel:
        type: xyplot
        xaxis: sel
        yaxis: Glitch_max
    conditions:
      sel:
        enumerate: [0, 1, 2]
      tstop:
        description: Transient length
        display: tstop
        unit: s
        enumerate: [6e-05]

  mm_params:
    spec:
      Vos_out:
        display: Output offset - mismatch
        description: pad - vref at vd = 0, local mismatch
        unit: mV
        minimum:
          value: -20
        typical:
          value: any
        maximum:
          value: 20
      Gain:
        display: Gain - mismatch
        description: Small-signal gain, local mismatch
        minimum:
          value: 0.49
        typical:
          value: any
        maximum:
          value: 0.51
      IqP:
        display: Quiescent current OP - mismatch
        description: Local mismatch
        unit: uA
        minimum:
          value: 100
        typical:
          value: any
        maximum:
          value: 400
    tool:
      ngspice:
        template: sg13cmos5l_IOPadDiff2Single_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Gain, Vos_out, INL, Iio, Icore, IqP, IqN, Imin]
    conditions:
      iterations:
        description: Monte Carlo iterations
        display: Iterations
        minimum: 1
        maximum: 30
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
      corner_r:
        typical: typ_mismatch
