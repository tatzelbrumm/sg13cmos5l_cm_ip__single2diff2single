short-description: Single-ended-to-differential-to-single-ended analog pin buffer pair with on-die bias generation, designed against the Chipalooza harness slot interface.

# Please add the documentation about your project here.
# Why did you choose to create it? How does it work? How can it be tested, etc.?
# If your project requires additional external hardware, e.g. a USB port,
# please mention this so it can be considered when designing the PCB.
long-description: |
  Single-ended <-> differential analog pin buffers for I/O-limited shared-die
  platforms (Chipalooza, TinyTapeout, HeiChips).

  On-chip analog building blocks (amplifiers, filters, comparators, ...)
  should be fully differential in/out for signal range and PSRR, but shared
  multi-user platforms hand each participant only a few single-ended pins.
  This macro bridges that gap: a single-ended-in pin buffers into a fully
  differential internal signal, and a differential-in class-AB driver
  buffers back out to a single-ended pin, so a slot's scarce single-ended
  pins can still host differential circuitry.

  Planned circuit blocks:

  * a single-ended-to-differential input buffer and a differential-to-
    single-ended class-AB output buffer (unity / negative-unity gain), each
    possibly integrated into its pin
  * an internal common-mode voltage reference (V_CM), switchable between the
    analog pin, an internal source, or the infrastructure supply
  * a fully differential gmC stage, switchable between filtering the input
    signal and running as a self-sustained quadrature oscillator, as a
    self-contained proof-of-concept circuit
  * digital control (enables, mode selects, trim) -- currently wired
    directly to the harness's dig_in/dig_out bus rather than through an
    on-die scan chain; whether a scan chain is still needed is reopened,
    not decided (see TOP_LEVEL_MODULE.md section 2.3)
  * bias generation from an Oguey & Aebischer ultra-high-input-impedance,
    low-noise bias block (imported into macros/OgueyAebischerBias/, not yet
    wired into the design)

  How it is tested: a single-ended input is fed through the input buffer,
  the differential gmC stage and the output buffer. Nine testbench
  configurations (selected via digital control bits, currently wired
  directly to the harness's dig_in bus -- see note above) exercise the
  output buffer alone, the input buffer alone, the two chained with the
  filter off, the filter as a driven filter, the filter as a free-running or
  driven oscillator, and the shared differential lines shorted to
  characterize wire/pad parasitics. The two shared analog pins (vdiffp,
  vdiffn) carry the unbuffered internal differential signal so the input and
  output stages can be characterized separately; measuring them needs either
  an external instrumentation amplifier or an active differential
  oscilloscope probe, since the true internal differential nodes are not
  brought out to a low-impedance output. All pins of this macro connect to
  the sg13cmos5l_ocd_chipalooza harness (there is no standalone breakout);
  digital control is driven and read back through the harness's own
  housekeeping SPI / dig_in / dig_out mechanism, not an independent USB
  pattern generator.

  See sudelbuecher/description/s2d_d2s_pinbuffers.md (branch sudel_buecher,
  the _sudelbuecher worktree) for the full proposal: pinout tables, bias and
  bandwidth targets, and open questions.

  NOTE: the layout, schematic and netlists currently committed in this
  repository are still the unmodified `inverter` example carried over from the
  Chipalooza Analog Project template. Only the *names* have been changed so
  far (see README.md and CLAUDE.md, section 7). Replace the circuit, then
  re-run `make all` and rewrite this section to describe the final, as-built
  circuit.

